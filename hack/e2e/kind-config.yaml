# kind cluster for the CloudStack simulator e2e environment.
#
# - `cloud-provider: external` makes every node register with the
#   node.cloudprovider.kubernetes.io/uninitialized taint, which the CCM under
#   test is responsible for removing.
# - `kubelet-preferred-address-types: InternalIP` keeps `kubectl logs`/`exec`
#   working after node initialization: the CCM sets the node's Hostname
#   address to the CloudStack instance hostname (the simulated hypervisor
#   agent), which is not resolvable from the API server.
# - Two workers so tests can assert that the control-plane node (labeled
#   node.kubernetes.io/exclude-from-external-load-balancers by kubeadm) is
#   excluded from load balancer membership.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cs-ccm-e2e
networking:
  ipFamily: ipv4
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            cloud-provider: external
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            kubelet-preferred-address-types: InternalIP
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            cloud-provider: external
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            cloud-provider: external
